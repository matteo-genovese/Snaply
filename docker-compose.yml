services:
  snaply:
    # L'immagine la costruisce la CI (.github/workflows/image.yml) e la pubblica
    # su GHCR: lo stack la tira e basta, senza build sul server.
    image: ghcr.io/matteo-genovese/snaply:latest
    container_name: snaply
    restart: unless-stopped
    networks:
      - public_net

networks:
  public_net:
    external: true
