name: Build & Publish Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: matteo-genovese/snaply

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check config
        run: |
          test -n "${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}" || { echo "manca la variabile VITE_CLOUDINARY_CLOUD_NAME"; exit 1; }
          test -n "${{ vars.VITE_CLOUDINARY_UPLOAD_PRESET }}" || { echo "manca la variabile VITE_CLOUDINARY_UPLOAD_PRESET"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_CLOUDINARY_CLOUD_NAME=${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
            VITE_CLOUDINARY_UPLOAD_PRESET=${{ vars.VITE_CLOUDINARY_UPLOAD_PRESET }}
            VITE_APP_TITLE=${{ vars.VITE_APP_TITLE }}
            VITE_APP_SUBTITLE=${{ vars.VITE_APP_SUBTITLE }}
            VITE_APP_PRIMARY_COLOR=${{ vars.VITE_APP_PRIMARY_COLOR }}
